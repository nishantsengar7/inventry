version: "3.9"

# ── Named volumes ──────────────────────────────────────────────
volumes:
  postgres_data:   # Persists Postgres data across container restarts
  pgadmin_data:    # Persists pgAdmin settings

# ── Services ──────────────────────────────────────────────────
services:

  # ──────────────────────────────────────────────────────────
  # 1. PostgreSQL 15
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       inventory_db
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"       # expose for local DB clients / pgAdmin desktop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 2. FastAPI Backend
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # wait for Postgres to be ready
    environment:
      DATABASE_URL:  postgresql://admin:admin123@postgres:5432/inventory_db
      SECRET_KEY:    supersecretkey123changeInProduction
      ALGORITHM:     HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    volumes:
      # Mount source for hot-reload during development
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 3. React Frontend (Nginx)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ims_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # 4. pgAdmin 4 (database GUI)
  # ──────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ims_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
